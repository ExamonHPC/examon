name: K8s Integration Test

on:
  push:
    branches:
      - master
      - develop
      - release/*
  pull_request:
    branches:
      - master
      - develop

jobs:
  k8s-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Create K3d cluster with local registry
        run: k3d cluster create --config deploy/k3d/local-cluster.yaml

      - name: Wait for cluster readiness
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl get nodes

      - name: Register registry hostname
        run: echo "127.0.0.1 examon-registry" | sudo tee -a /etc/hosts

      - name: Build and push container images
        run: ./scripts/build-and-push-images.sh examon-registry:5111

      - name: Add Helm repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add k8ssandra https://helm.k8ssandra.io/stable
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Install cert-manager
        run: |
          helm install cert-manager jetstack/cert-manager \
            -n cert-manager --create-namespace \
            --set crds.enabled=true --wait --timeout 3m

      - name: Update Helm dependencies
        run: helm dependency update deploy/helm/examon

      - name: "Deploy ExaMon (phase 1: operators only)"
        run: |
          helm install examon deploy/helm/examon \
            -f deploy/helm/examon/values-local.yaml \
            --set cassandra.enabled=false \
            -n examon --create-namespace --timeout 10m

      - name: Wait for K8ssandra operator webhook
        run: |
          echo "Waiting for K8ssandra operator to be ready..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=k8ssandra-operator \
            -n examon --timeout=120s
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=cass-operator \
            -n examon --timeout=120s
          echo "Waiting for webhook endpoint registration..."
          sleep 10
          echo "Operators ready."

      - name: "Deploy ExaMon (phase 2: full stack with Cassandra)"
        run: |
          helm upgrade examon deploy/helm/examon \
            -f deploy/helm/examon/values-local.yaml \
            -n examon --timeout 15m

      - name: Wait for Cassandra to be ready
        run: |
          echo "Waiting for Cassandra pod..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=cassandra \
            -n examon --timeout=600s
          echo "Cassandra is ready."

      - name: Wait for core services
        run: |
          echo "Waiting for KairosDB..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=kairosdb \
            -n examon --timeout=300s

          echo "Waiting for Mosquitto..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=mosquitto \
            -n examon --timeout=120s

          echo "Waiting for Grafana..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=grafana \
            -n examon --timeout=120s

          echo "Waiting for examon-server..."
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=examon-server \
            -n examon --timeout=300s

          echo "All core services ready."

      - name: Check pod status
        run: |
          kubectl get pods -n examon -o wide
          kubectl get svc -n examon

      - name: Test KairosDB health endpoint
        run: |
          kubectl port-forward svc/examon-kairosdb 8083:8083 -n examon &
          sleep 5
          timeout 30s bash -c 'while [[ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8083/api/v1/health/check)" != "204" ]]; do
            echo "Waiting for KairosDB health..."
            sleep 3
          done'
          echo "KairosDB is healthy."

      - name: Test Grafana accessibility
        run: |
          kubectl port-forward svc/examon-grafana 3000:80 -n examon &
          sleep 5
          timeout 30s bash -c 'while [[ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)" != "302" ]]; do
            echo "Waiting for Grafana..."
            sleep 3
          done'
          echo "Grafana is accessible."

      - name: Test ExaMon API server
        run: |
          kubectl port-forward svc/examon-examon-server 5000:5000 -n examon &
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/)
          if [[ "$STATUS" == "401" || "$STATUS" == "200" ]]; then
            echo "ExaMon API is responding (HTTP $STATUS)."
          else
            echo "ERROR: ExaMon API returned unexpected HTTP $STATUS"
            exit 1
          fi

      - name: Test MQTT broker connectivity
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto-clients > /dev/null 2>&1
          kubectl port-forward svc/examon-mosquitto 1883:1883 -n examon &
          sleep 3
          mosquitto_sub -h localhost -p 1883 -t 'ci/test' -C 1 -W 10 &
          SUB_PID=$!
          sleep 1
          mosquitto_pub -h localhost -p 1883 -t 'ci/test' -m 'hello from CI'
          wait $SUB_PID
          echo "MQTT pub/sub test passed."

      - name: Verify data pipeline (random_pub -> MQTT -> KairosDB)
        run: |
          echo "Checking random_pub is publishing..."
          kubectl logs -l app.kubernetes.io/name=random-pub -n examon --tail=5
          echo "Checking mqtt2kairosdb is bridging..."
          kubectl logs -l app.kubernetes.io/name=mqtt2kairosdb -n examon --tail=5
          echo "Querying KairosDB for metrics..."
          METRICS=$(curl -s http://localhost:8083/api/v1/metricnames | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('results',[])))" 2>/dev/null || echo "0")
          if [[ "$METRICS" -gt 0 ]]; then
            echo "Data pipeline verified: $METRICS metrics found in KairosDB."
          else
            echo "WARNING: No metrics in KairosDB yet (may need more time)."
          fi

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n examon -o wide
          echo ""
          echo "=== Events ==="
          kubectl get events -n examon --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n examon -o name); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n examon --tail=80 --all-containers || true
            echo ""
          done

      - name: Cleanup
        if: always()
        run: k3d cluster delete examon-local
