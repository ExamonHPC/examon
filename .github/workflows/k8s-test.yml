name: K8s Integration Test

on:
  push:
    branches:
      - master
      - develop
      - release/*
  pull_request:
    branches:
      - master
      - develop

jobs:
  k8s-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Create K3d cluster
        run: k3d cluster create --config deploy/k3d/local-cluster.yaml

      - name: Wait for cluster readiness
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl get nodes

      - name: Register registry hostname
        run: echo "127.0.0.1 examon-registry" | sudo tee -a /etc/hosts

      - name: Build container images
        run: |
          docker build -t examon-registry:5111/examon/mosquitto:latest \
            -f deploy/docker/mosquitto/Dockerfile deploy/docker/mosquitto/

          docker build -t examon-registry:5111/examon/kairosdb:1.3.0 \
            -f deploy/docker/kairosdb/Dockerfile deploy/docker/kairosdb/

          docker build -t examon-registry:5111/examon/mqtt2kairosdb:latest \
            -f deploy/docker/mqtt2kairosdb/Dockerfile deploy/docker/mqtt2kairosdb/

          docker build -t examon-registry:5111/examon/random-pub:latest \
            -f deploy/docker/random-pub/Dockerfile .

          docker build -t examon-registry:5111/examon/examon-server:latest \
            -f deploy/docker/examon-server/Dockerfile .

      - name: Push images to local registry
        run: |
          docker push examon-registry:5111/examon/mosquitto:latest
          docker push examon-registry:5111/examon/kairosdb:1.3.0
          docker push examon-registry:5111/examon/mqtt2kairosdb:latest
          docker push examon-registry:5111/examon/random-pub:latest
          docker push examon-registry:5111/examon/examon-server:latest

      - name: Add Helm repositories
        run: |
          helm repo add k8ssandra https://helm.k8ssandra.io/stable
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Install K8ssandra operator
        run: |
          helm install k8ssandra-operator k8ssandra/k8ssandra-operator \
            -n examon --create-namespace --wait --timeout 5m

      - name: Update Helm dependencies
        run: helm dependency update deploy/helm/examon

      - name: Deploy ExaMon
        run: |
          helm install examon deploy/helm/examon \
            -f deploy/helm/examon/values-local.yaml \
            -n examon --wait --timeout 10m

      - name: Check pod status
        run: kubectl get pods -n examon -o wide

      - name: Test Mosquitto MQTT broker
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=mosquitto \
            -n examon --timeout=120s
          echo "Mosquitto is ready"

      - name: Test KairosDB health
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=kairosdb \
            -n examon --timeout=300s
          kubectl port-forward svc/examon-kairosdb 8083:8083 -n examon &
          sleep 5
          timeout 30s bash -c 'while [[ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8083/api/v1/health/check)" != "204" ]]; do
            echo "Waiting for KairosDB..."
            sleep 3
          done'
          echo "KairosDB is healthy"

      - name: Test Grafana accessibility
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=grafana \
            -n examon --timeout=120s
          kubectl port-forward svc/examon-grafana 3000:80 -n examon &
          sleep 5
          timeout 30s bash -c 'while [[ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)" != "302" ]]; do
            echo "Waiting for Grafana..."
            sleep 3
          done'
          echo "Grafana is accessible"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n examon -o wide
          echo "=== Events ==="
          kubectl get events -n examon --sort-by='.lastTimestamp'
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n examon -o name); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n examon --tail=50 || true
          done

      - name: Cleanup
        if: always()
        run: k3d cluster delete examon-local
