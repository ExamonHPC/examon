name: K8s Integration Test

on:
  push:
    branches:
      - master
      - develop
      - release/*
  pull_request:
    branches:
      - master
      - develop
      - release/*

jobs:
  k8s-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Deploy ExaMon
        run: ./scripts/k8s-local-setup.sh --ci

      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto-clients > /dev/null 2>&1

      - name: Run smoke tests
        run: ./scripts/k8s-smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n examon -o wide
          echo ""
          echo "=== Events ==="
          kubectl get events -n examon --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n examon -o name); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n examon --tail=80 --all-containers || true
            echo ""
          done

      - name: Cleanup
        if: always()
        run: k3d cluster delete examon-local
