# ExaMon Local Development Values (K3d)
# Single-node Cassandra, minimal resources, no TLS, no NetworkPolicies.
#
# SECRETS: Do NOT put real passwords in this file. Pass them at deploy time:
#   helm upgrade examon ./deploy/helm/examon -f values-local.yaml \
#     --set examon-server.config.cassandraPassword="$(kubectl get secret \
#       examon-cassandra-superuser -n examon -o jsonpath='{.data.password}' | base64 -d)" \
#     -n examon

cassandra:
  enabled: true
  serverVersion: "4.0.14"
  datacenters:
    dc1:
      size: 1
      storage: "5Gi"
      heapSize: "256M"
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1"
      podAntiAffinity: false
  reaper:
    enabled: false

grafana:
  enabled: true
  adminPassword: "admin"  # dev-only default; override via --set for non-local envs
  persistence:
    enabled: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"

kairosdb:
  enabled: true
  replicaCount: 1
  image:
    repository: examon-registry:5111/examon/kairosdb
    tag: "1.3.0-fix3"
  config:
    javaOpts: "-Xmx512m -Xms256m"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

mosquitto:
  enabled: true
  image:
    repository: examon-registry:5111/examon/mosquitto
    tag: "latest"
  persistence:
    enabled: false
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "250m"

mqtt2kairosdb:
  enabled: true
  image:
    repository: examon-registry:5111/examon/mqtt2kairosdb
    tag: "latest"
  config:
    mqtt:
      broker: "examon-mosquitto"
    kairosdb:
      servers: "examon-kairosdb"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

random-pub:
  enabled: true
  image:
    repository: examon-registry:5111/examon/random-pub
    tag: "latest"
  config:
    mqttBroker: "examon-mosquitto"
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "250m"

examon-server:
  enabled: true
  replicaCount: 1
  image:
    repository: examon-registry:5111/examon/examon-server
    tag: "latest"
  config:
    authUrl: "http://examon-grafana/api/datasources/id/kairosdb"
    cassandraIp: "examon-cassandra-dc1-service"
    cassandraKeySpace: "kairosdb"
    # Cassandra credentials — pass via --set at deploy time (see header comment)
    cassandraUser: "examon-cassandra-superuser"
    cassandraPassword: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"
