# ExaMon Staging Values (K3d multi-node on single VM)
# Full HA topology with minimal resources. random_pub enabled for pipeline validation.
# Self-signed TLS, NetworkPolicies enabled.
#
# SECRETS: Do NOT put real passwords in this file. Cassandra credentials are
# injected automatically from the K8ssandra-generated secret
# (examon-cassandra-superuser) via secretKeyRef — no --set flags needed.
# Only Grafana admin password requires --set:
#   helm upgrade examon ./deploy/helm/examon -f values-staging.yaml \
#     --set grafana.adminPassword="<your-grafana-password>" -n examon

cassandra:
  enabled: true
  serverVersion: "4.0.14"
  datacenters:
    dc1:
      size: 3
      storage: "10Gi"
      heapSize: "256M"
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1"
      podAntiAffinity: true
      racks:
        - name: rack1
          affinityLabels:
            topology.kubernetes.io/zone: zone-a
        - name: rack2
          affinityLabels:
            topology.kubernetes.io/zone: zone-b
        - name: rack3
          affinityLabels:
            topology.kubernetes.io/zone: zone-c
  reaper:
    enabled: true

grafana:
  enabled: true
  adminPassword: ""  # pass via --set grafana.adminPassword=... at deploy time
  service:
    type: NodePort
    nodePort: 3000
  plugins:
    - ae3e-plotly-panel
    - grafana-piechart-panel
    - yesoreyeram-infinity-datasource
    - marcusolsson-gantt-panel
    - flant-statusmap-panel
    - gapit-htmlgraphics-panel
    - https://github.com/ArpNetworking/kairosdb-datasource/releases/download/v4.0.7/kairosdb-datasource.zip;arpnetworking-kairosdb-datasource
  env:
    GF_PANELS_DISABLE_SANITIZE_HTML: "true"
  grafana.ini:
    plugins:
      allow_loading_unsigned_plugins: arpnetworking-kairosdb-datasource
  persistence:
    enabled: true
    size: 1Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: kairosdb
          uid: examon-kairosdb
          type: arpnetworking-kairosdb-datasource
          access: proxy
          url: http://examon-kairosdb:8083
          isDefault: true
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"

kairosdb:
  enabled: true
  replicaCount: 2
  image:
    repository: examon-registry:5111/examon/kairosdb
    tag: "1.3.0-fix3"
  config:
    javaOpts: "-Xmx512m -Xms256m"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"

mosquitto:
  enabled: true
  image:
    repository: examon-registry:5111/examon/mosquitto
    tag: "latest"
  service:
    type: NodePort
    nodePort: 1883
  persistence:
    enabled: true
    size: 1Gi
  tls:
    enabled: true
    secretName: mosquitto-tls
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "250m"

mqtt2kairosdb:
  enabled: true
  replicaCount: 1
  image:
    repository: examon-registry:5111/examon/mqtt2kairosdb
    tag: "latest"
  config:
    mqtt:
      broker: "examon-mosquitto"
    kairosdb:
      servers: "examon-kairosdb"
    daemon:
      numWorkers: 4
      logLevel: "INFO"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"

random-pub:
  enabled: true
  replicaCount: 1
  image:
    repository: examon-registry:5111/examon/random-pub
    tag: "latest"
  config:
    mqttBroker: "examon-mosquitto"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

examon-server:
  enabled: true
  replicaCount: 2
  image:
    repository: examon-registry:5111/examon/examon-server
    tag: "latest"
  service:
    type: NodePort
    nodePort: 5000
  config:
    authUrl: "http://examon-grafana/api/datasources/id/kairosdb"
    cassandraIp: "examon-cassandra-dc1-service"
    cassandraKeySpace: "kairosdb"
    cassandraAuth:
      secretName: "examon-cassandra-superuser"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"
