# ExaMon Production Values
# Full HA, production resources, TLS, Medusa backups.
# Targets a real Kubernetes cluster: on-prem (OpenStack, RKE2, kubeadm)
# or cloud-managed (EKS, GKE, AKS).
#
# SECRETS: Do NOT put real passwords in this file. Cassandra credentials are
# injected automatically from the K8ssandra-generated secret
# (examon-cassandra-superuser) via secretKeyRef — no --set flags needed.
# Only Grafana admin password requires --set:
#   helm upgrade examon ./deploy/helm/examon -f values-production.yaml \
#     --set grafana.adminPassword="<your-grafana-password>" -n examon
#
# USER-FACING SERVICES:
#   Grafana + ExaMon API → exposed via Ingress (HTTP/HTTPS)
#   MQTT broker          → exposed via LoadBalancer (TCP, L4)
#
# IMAGE PULL SECRETS:
#   If your images live in a private registry (e.g. ghcr.io), create a pull
#   secret first and reference it globally:
#     kubectl create secret docker-registry ghcr-cred \
#       --docker-server=ghcr.io --docker-username=<user> \
#       --docker-password=<PAT> -n examon
#   Then either set it globally below, or per-subchart via imagePullSecrets.

global:
  imagePullSecrets: []
  # - name: ghcr-cred

cassandra:
  enabled: true
  serverVersion: "4.0.14"
  datacenters:
    dc1:
      size: 3
      storage: "100Gi"
      storageClass: ""
      heapSize: "2G"
      resources:
        requests:
          memory: "4Gi"
          cpu: "2"
        limits:
          memory: "8Gi"
          cpu: "4"
      podAntiAffinity: true
      racks:
        - name: rack1
          affinityLabels:
            topology.kubernetes.io/zone: ""
        - name: rack2
          affinityLabels:
            topology.kubernetes.io/zone: ""
        - name: rack3
          affinityLabels:
            topology.kubernetes.io/zone: ""
  reaper:
    enabled: true

grafana:
  enabled: true
  # Set via --set or external secret in production
  adminPassword: ""
  plugins:
    - ae3e-plotly-panel
    - grafana-piechart-panel
    - yesoreyeram-infinity-datasource
    - marcusolsson-gantt-panel
    - flant-statusmap-panel
    - gapit-htmlgraphics-panel
    - https://github.com/ArpNetworking/kairosdb-datasource/releases/download/v4.0.7/kairosdb-datasource.zip;arpnetworking-kairosdb-datasource
  env:
    GF_PANELS_DISABLE_SANITIZE_HTML: "true"
  grafana.ini:
    plugins:
      allow_loading_unsigned_plugins: arpnetworking-kairosdb-datasource
  persistence:
    enabled: true
    size: 10Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: kairosdb
          uid: examon-kairosdb
          type: arpnetworking-kairosdb-datasource
          access: proxy
          url: http://examon-kairosdb:8083
          isDefault: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "2"
  ingress:
    enabled: true
    ingressClassName: nginx  # adjust to your cluster: nginx, traefik, openstack, etc.
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.example.com  # replace with your actual domain
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.example.com

kairosdb:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/examonhpc/kairosdb
    tag: "1.3.0"
  config:
    cassandraHostList: "examon-cassandra-dc1-service:9042"
    jettyPort: 8083
    javaOpts: "-Xmx2g -Xms2g"
  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"

mosquitto:
  enabled: true
  image:
    repository: ghcr.io/examonhpc/mosquitto
    tag: "latest"
  persistence:
    enabled: true
    size: 5Gi
  tls:
    enabled: true
    secretName: mosquitto-tls
  service:
    type: LoadBalancer
    annotations: {}
    # OpenStack example:
    #   loadbalancer.openstack.org/flavor-id: "<flavor-uuid>"
    # Cloud provider examples:
    #   service.beta.kubernetes.io/aws-load-balancer-type: nlb
    #   cloud.google.com/l4-rbs: "enabled"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1"

mqtt2kairosdb:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/examonhpc/mqtt2kairosdb
    tag: "latest"
  config:
    mqtt:
      broker: "examon-mosquitto"
    kairosdb:
      servers: "examon-kairosdb"
    daemon:
      numWorkers: 4
      logLevel: "INFO"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "2"

random-pub:
  enabled: false

examon-server:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/examonhpc/examon-server
    tag: "latest"
  config:
    authUrl: "http://examon-grafana/api/datasources/id/kairosdb"
    cassandraIp: "examon-cassandra-dc1-service"
    cassandraKeySpace: "kairosdb"
    cassandraAuth:
      secretName: "examon-cassandra-superuser"
    serverHost: "0.0.0.0"
    serverPort: 5000
    threadsNum: 8
    schedulerType: "SLURM"
    cacheType: "simple"
    cacheTimeout: 18000
  ingress:
    enabled: true
    ingressClassName: nginx  # adjust to your cluster
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: api.examon.example.com  # replace with your actual domain
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: examon-api-tls
        hosts:
          - api.examon.example.com
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"
