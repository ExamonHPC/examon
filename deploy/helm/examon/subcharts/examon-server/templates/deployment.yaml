apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "examon-server.fullname" . }}
  labels:
    {{- include "examon-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "examon-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "examon-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (coalesce .Values.imagePullSecrets .Values.global.imagePullSecrets) }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.config.cassandraAuth.secretName }}
      initContainers:
        - name: wait-cassandra-secret
          image: busybox
          command: ['sh', '-c', 'until [ -f /secret/username ] && nc -z examon-cassandra-dc1-service 9042; do echo "waiting for cassandra secret and connectivity..."; sleep 5; done; echo "Cassandra reachable, waiting for auth initialization..."; sleep 30']
          volumeMounts:
            - name: cassandra-secret
              mountPath: /secret
              readOnly: true
      {{- end }}
      containers:
        - name: examon-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.config.cassandraAuth.secretName }}
          env:
            - name: CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.cassandraAuth.secretName }}
                  key: {{ .Values.config.cassandraAuth.usernameKey | default "username" }}
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.cassandraAuth.secretName }}
                  key: {{ .Values.config.cassandraAuth.passwordKey | default "password" }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.serverPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/server.conf
              subPath: server.conf
      volumes:
        - name: config
          configMap:
            name: {{ include "examon-server.fullname" . }}
        {{- if .Values.config.cassandraAuth.secretName }}
        - name: cassandra-secret
          secret:
            secretName: {{ .Values.config.cassandraAuth.secretName }}
        {{- end }}
