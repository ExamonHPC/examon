apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: examon-local
servers: 1
agents: 2
registries:
  create:
    name: examon-registry
    hostPort: "5111"
ports:
  - port: 8880:80
    nodeFilters:
      - loadbalancer
  - port: 1883:1883
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --service-node-port-range=1883-32767
        nodeFilters:
          - server:*
