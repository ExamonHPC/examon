site_name: ExaMon
site_url: 'https://examonhpc.github.io/examon' 
repo_url: https://github.com/ExamonHPC/examon
repo_name: ExamonHPC/examon
site_description: Gain deeper insights into your data with advanced monitoring, analytics and visualization tools.
# copyright: Copyright &copy; 2023 Francesco Beneventi

theme:
  name: material
  custom_dir: docs/overrides/
  features:
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - announce.dismiss
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/images/favicon.png
  icon:
    annotation: material/arrow-right-circle

plugins:
  - blog
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocs-jupyter:
      include_source: True

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc
  - extra
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
    - Home: index.md
    - Get Started:
        - get-started/index.md
        - get-started/what-is-examon.md
        - get-started/quickstart.md
        - get-started/core-concepts.md
        - get-started/where-next.md
    - Administrators:
        - administrators/index.md
        - Deploy:
            - administrators/deploy/index.md
            - administrators/deploy/prerequisites.md
            - administrators/deploy/topology.md
            - administrators/deploy/on-kubernetes.md
            - administrators/deploy/local-development.md
            - administrators/deploy/staging.md
            - administrators/deploy/harden-for-production.md
            - administrators/deploy/with-docker-compose.md
            - administrators/deploy/upgrade.md
        - Publishers:
            - administrators/publishers/index.md
            - administrators/publishers/prometheus-pub.md
        - Operations:
            - administrators/operations/index.md
            - administrators/operations/configure.md
            - administrators/operations/troubleshoot.md
            - administrators/operations/change-propagation.md
    - Users:
        - users/index.md
        - Dashboards:
            - users/dashboards/index.md
        - Analyze:
            - users/analyze/index.md
            - users/analyze/Demo_ExamonQL.ipynb
        - AI:
            - users/ai/index.md
    - Developers:
        - developers/index.md
        - SDK v3:
            - developers/sdk-v3/index.md
            - Examples:
                - developers/sdk-v3/examples/examon_pub.ipynb
        - developers/contributing.md
    - Concepts:
        - concepts/index.md
        - concepts/architecture.md
        - concepts/data-model.md
        - concepts/plugin-model.md
    - Reference:
        - reference/index.md
        - reference/component-catalog.md
        - reference/glossary.md
        - reference/configuration.md
        - reference/cli.md
        - reference/api.md
    - Community:
        - community/index.md
        - community/about.md
        - community/credits.md
        - community/publications.md
        - community/contact.md
        - Clusters:
            - community/clusters/index.md
            - community/clusters/marconi100.md
            - community/clusters/montecimone.md
            - community/clusters/montecimone-notebook.ipynb
        - Releases:
            - community/releases/index.md
            - community/releases/v0.5.0.md
            - community/releases/v0.5.0-plan.md
    - Blog:
        - blog/index.md

extra:
  version:
    provider: mike
    alias: true
    default: latest
