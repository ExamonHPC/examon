site_name: ExaMon
site_url: 'https://examonhpc.github.io/examon' 
repo_url: https://github.com/ExamonHPC/examon
repo_name: ExamonHPC/examon
site_description: Gain deeper insights into your data with advanced monitoring, analytics and visualization tools.
# copyright: Copyright &copy; 2023 Francesco Beneventi

theme:
  name: material
  custom_dir: docs/overrides/
  features:
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - navigation.footer
    - announce.dismiss
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/images/favicon.png
  icon:
    annotation: material/arrow-right-circle

plugins:
  - blog
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocs-jupyter:
      include_source: True

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc
  - extra
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
    - Home: "index.md"
    - Introduction: "Introduction.md"
    - Getting started: "getting_started.md"
    - Deployment:
      - Overview: Deployment/index.md
      - Prerequisites: Deployment/prerequisites.md
      - Architecture: Deployment/architecture.md
      - Kubernetes:
        - Helm Chart Guide: Deployment/kubernetes.md
        - Local Development: Deployment/kubernetes-local.md
        - Staging: Deployment/kubernetes-staging.md
        - Production: Deployment/kubernetes-production.md
      - Docker Compose: Deployment/docker-compose.md
      - Configuration Reference: Deployment/configuration.md
      - Troubleshooting: Deployment/troubleshooting.md
      - Upgrading from v0.4.0: Deployment/upgrading.md
    - Administrators:
      - Getting started: Administrators/Getting_started.md
    - Users:
      - Getting started: Users/Getting_started.md
    - Plugins:
      - Example plugin: 'Plugins/examon_pub.ipynb'
    - Clusters:
      - Marconi 100: "Marconi100/Metrics_reference.md"
      - MonteCimone:
        - Introduction: "MonteCimone/MonteCimone.md"
        - Notebooks:
          - Getting started: "MonteCimone/Examon_Monte_Cimone.ipynb" 
    - About: "About.md"
    - Credits: "credits.md"
    - Contact Us: "contactus.md"
    - Publications: "publications.md"
    - Contributing: "contributing.md"
    - Blog:
      - blog/index.md

extra:
  version:
    provider: mike
    alias: true
    default: latest
